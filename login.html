<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./login.css" />
  <title>Document</title>
</head>
<body>
  <div class="login-box">
    <div class="login-logo"><img src="./images/Property 1=lg.png"></div>
    <div class="login-form">
    <form class="login-formbox">
      <div class="login-email">
      <p>이메일</p>
      <input type="text" name="email">
      </div>
      <div class="login-password">
      <p>비밀번호</p>
      <input type="password" name="password">
      </div>
      <div class="login-buttonbox">
      <button class="login-button">로그인</button>
      </div>
    </form>

      <div class="login-easy">
        <div class="login-easybox">
          <div class="login-easy-left"><p>간편 로그인하기</p></div>
          <div class="login-easy-right">
            <img src="./icon/Component 2 (1).png">
            <img src="./icon/Component 3@3x.png">
          </div>
        </div>
      </div>
      
      <div class="login-footer"><p>판다마켓이 처음이신가요?</p><a href="/signup">회원가입</a></div>
    
    </div>
  </div>
</body>
</html>
