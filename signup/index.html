<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>회원가입</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="../styles/signup.css">
</head>
  
  <body>
    <div class="signup-container">
      <header>
        <nav class="logo-wrap">
          <a href="/" class="head-link">
            <img class="main-logo" src="../images/logo-set.svg" alt="판다마켓">
          </a>
        </nav>
      </header> 

      <main>
        <section class="email">
          <div class="email-inner">
            <h1 class="email-title">이메일</h1>
            <form class="signup-form">
              <input type="email" placeholder="이메일 주소" required />
            </form>
          </div>
        </section>

        <section class="nickname">
          <div class="nickname-inner">
            <h2 class="nickname-title">닉네임</h2>
            <form class="signup-form">
              <input type="text" placeholder="닉네임" required />
            </form>
          </div>
        </section>
      
        <section class="password">
          <div class="pw-inner">
            <h3 class="pw-title">비밀번호</h3>
            <form class="pw-form">
              <div class="pw-field">
                <input type="password" placeholder="비밀번호" required />
                <img src="../images/eye.svg" alt="비밀번호 보기" class="pw-eye" />
              </div>
            </form>
          </div>
        </section>

        <section class="confirm-password">
          <div class="confirm-pw-inner">
            <h4 class="confirm-pw-title">비밀번호 확인</h4>
            <form class="pw-form">
              <div class="pw-field">
                <input type="password" placeholder="비밀번호 확인" required />
                <img src="../images/open-eye.svg" alt="비밀번호 확인" class="pw-openeye" />
              </div>
            </form>
          </div>
        </section>
        <button type="submit" class="submit">회원가입</button>
      </main>

      <footer>
        <section class="easyLogin">
          <div class="easyLogin-inner">
            <span class="easyLogin-text">간편 로그인하기</span>
            <div class="sns-login">
              <a href="https://www.google.com/?hl=ko" target="_blank" class="google">
              <img src="../images/google.svg" alt="google" />
              </a>
              <a href="https://www.kakaocorp.com/page/service/service/KakaoTalk" target="_blank" class="kakaoTalk">
              <img src="../images/kakaoTalk.svg" alt="kakaoTalk" />
              </a>
            </div>
          </div>      
        </section>

        <section class="frist-signup">
          <span class="no-account"> 이미 회원이신가요? </span> 
          <a href="/login/" class="sign-up-link">로그인</a>
        </section>
        </footer>
    </div>
  </body>
</html>
