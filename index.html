<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>판다마켓</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="./styles/style.css"/>
</head>


<body>
  <header>
   <nav class="headinner">
      <a href="/" class="head-left">
        <img class="logo" src="./images/logo.png" alt="판다마켓 로고">
        <img class="logo-text" src="images/pandamarkettext.svg" alt="판다마켓">
      </a>
      <a href="/login/" class="login">로그인</a>
    </nav>
  </header> 

  <main>
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-text">
          <h1 class= "minititle1">일상의 모든 물건을<br>거래해 보세요</h1>
          <a href="/items/" class="gotosee">구경하러 가기</a>
        </div>
        <img class="hipanda" src="./images/Hipanda.png" alt="판다 벡터 이미지">
      </div>
    </section>
       
    <section class="feature-hot">
      <div class="feature-hot-inner">
        <img class="iloveshirt" src="./images/iloveshirt.png" alt="셔츠를 구매하는 구매자">
        <div class="feature-hot-text">
          <span class="HotItem">Hot Item</span>
          <h2 class="minititle2"> 인기 상품을 <br> 확인해 보세요 </h2>
          <p class="Describe2">가장 HOT한 중고거래 물품을 <br> 판다 마켓에서 확인해 보세요</p>
        </div>
      </div>
    </section>

    <section class="wantto-buy">
      <div class="wantto-buy-inner">
        <img class="wonder" src="./images/wonder.png" alt="돋보기가 그려짐">
        <div class="wantto-buy-text">
          <div class= "search">search</div>
          <h3 class= "minititle3">구매를 원하는 <br> 상품을 검색하세요</h3>
          <div class="Describe3">구매하고 싶은 물품은 검색해서 <br> 쉽게 찾아보세요</div>
        </div>
      </div>
    </section>

    <section class="wantto-sell">
      <div class="wantto-sell-inner">
        <img class="stuff" src="./images/stuff.png" alt="연필, 책, 안경 등 판매 예시">
        <div class="wantto-sell-text">
          <div class= "register">register</div>
          <h4 class= "minititle4">판매를 원하는 <br> 상품을 등록하세요</h4>
          <div class="Describe4">어떤 물건이든 판매하고 싶은 상품을 <br> 쉽게 등록하세요</div>
        </div>
      </div>
    </section>

     <section class="trustpanda">
        <div class="trustpanda-inner">
          <div class="trustpanda-text">
            <div class="trust">믿을 수 있는<br>판다마켓 중고 거래</div>
          </div>
          <img class="goodbyepanda" src="./images/goodbyepanda.png" alt="거래하고 안녕 하는 판다 두마리">
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="endofsite">

        <span class="codeit"> ⓒcodeit - 2024</span>

        <div class="privacyandFaq">
          <a href="/privacy/" class="Privacy">Privacy Policy</a>
          <a href="/faq/" class="FAQ">FAQ</a>
        </div>

        <div class="sns">
          <a href="https://www.facebook.com" target="_blank" class="Facebook">
          <img src="./images/facebook.png" alt="Facebook" />
          </a>
          <a href="https://twitter.com" target="_blank" class="twitter">
          <img src="./images/twitter.png" alt="Twitter" />
          </a>
          <a href="https://www.youtube.com" target="_blank" class="sns-link">
          <img src="./images/youtube.png" alt="YouTube" />
          </a>
          <a href="https://www.instagram.com" target="_blank" class="sns-link">
          <img src="./images/insta.png" alt="Instagram" />
          </a>
        </div>

      </div>  
    </footer>
