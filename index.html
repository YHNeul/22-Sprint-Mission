<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <title>판다마켓</title>
</head>
<body>
    <div id="wrap">
        <header>
            <h1 class="logo">
                <a href="index.html">
                    <span class="blind">판다마켓</span>
                </a>
            </h1>
            <div class="gnb">
                <a href="login.html" class="login">
                    <span>로그인</span>
                </a>
            </div>
        </header>
        <main class="container">
            <div class="visual">
                <div class="wrapper">
                    <div class="txt_wrap">
                        <h2 class="tit">
                            일상의 모든 물건을<br>
                            거래해 보세요
                        </h2>
                        <a href="items.html" class="more">구경하러 가기</a>
                    </div>
                    <div class="photo">
                        <img src="images/visual_img.png" alt="판다 1마리 배너 사진">
                    </div>
                </div>
            </div>
            <div class="hot_item">
                <div class="wrapper">
                    <img src="images/item_img.png" alt="인기상품사진">
                    <div class="txt_wrap">
                        <strong>Hot item</strong>
                        <h2>
                            인기 상품을<br>
                            확인해 보세요
                        </h2>
                        <p>
                            가장 HOT한 중고거래 물품을<br>
                            판다 마켓에서 확인해 보세요
                        </p>
                    </div>
                </div>
            </div>
            <div class="search">
                <div class="wrapper">
                    <div class="photo">
                        <img src="images/search_img.png" alt="검색사진">
                    </div>
                    <div class="txt_wrap">
                        <strong>Search</strong>
                        <h2>
                            구매를 원하는<br>
                            상품을 검색하세요
                        </h2>
                        <p>
                            구매하고 싶은 물품은 검색해서<br>
                            쉽게 찾아보세요
                        </p>
                    </div>
                </div>
            </div>
            <div class="register">
                <div class="wrapper">
                    <div class="photo">
                        <img src="images/register_img.png" alt="등록사진">
                    </div>
                    <div class="txt_wrap">
                        <strong>Register</strong>
                        <h2>
                            판매를 원하는 <br>
                            상품을 등록하세요
                        </h2>
                        <p>
                            어떤 물건이든 판매하고 싶은 상품을<br>
                            쉽게 등록하세요
                        </p>
                    </div>
                </div>
            </div>
            <div class="banner">
                <div class="wrapper">
                    <p>
                        믿을 수 있는<br>
                        판다마켓 중고 거래
                    </p>
                    <div class="photo">
                        <img src="images/banner_img.png" alt="판다 2마리 배너 사진">
                    </div>
                </div>
            </div>
        </main>
        <footer>
            <div class="wrapper">
                <div class="copy">©codeit - 2024</div>
                <div class="f_nav">
                    <ul>
                        <li><a href="#">Privacy Policy</a></li>
                        <li><a href="#">FAQ</a></li>
                    </ul>
                </div>
                <div class="sns">
                    <ul>
                        <li><a href="https://www.facebook.com/" target="_blank"><img src="images/ic_facebook.png" alt="페이스북 아이콘"></a></li>
                        <li><a href="https://x.com/" target="_blank"><img src="images/ic_twitter.png" alt="트위터 아이콘"></a></li>
                        <li><a href="https://www.youtube.com/" target="_blank"><img src="images/ic_youtube.png" alt="유튜브 아이콘"></a></li>
                        <li><a href="https://www.instagram.com/" target="_blank"><img src="images/ic_instagram.png" alt="인스타그램 아이콘"></a></li>
                    </ul>
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
